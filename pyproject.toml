[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tevind-deploy"
version = "0.1.0"
description = "Manage Frappe Docker deployments on an Ubuntu OVH VPS over SSH (CLI + MCP)."
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "mcp>=1.2.0",
    "httpx>=0.27",
    "ovh>=1.1",
]

[project.scripts]
tevind-deploy = "tevind_deploy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
